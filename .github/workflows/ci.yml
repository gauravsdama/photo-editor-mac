name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: swift build -c release
      - run: >-
          python3 scripts/inventory-swift-ui-copy.py --check
          --source Sources/PhaseOnePhotoEditor
          --output docs/product/UI_COPY_FULL.md
          --name PhotoEditorMac
